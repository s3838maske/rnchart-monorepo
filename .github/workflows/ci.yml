name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      # Budgets ratchet deliberately — see .size-limit.js. A failure here means
      # a package grew; raise the limit in the same commit as the code, or find
      # out why it grew.
      - name: Bundle size budgets
        run: yarn size

      # Runs every release gate: manifests, peer-range width, tarball contents.
      - name: Pre-publish verification
        if: matrix.node == 22
        run: yarn prepublish:check
