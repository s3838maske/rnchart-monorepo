# React Native and Metro do not work with Yarn PnP. The node-modules linker is
# not optional here.
nodeLinker: node-modules

# Yarn 4.18 disables package install scripts by default. React Native's native
# packages (Skia in particular) and eslint's native resolver need theirs to run,
# so re-enable them. Revisit if the dependency tree ever grows something
# untrusted — this is a real supply-chain trade-off, made deliberately.
enableScripts: true

enableTransparentWorkspaces: true
